<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#04060B">
<link rel="icon" href="../favicon.ico" sizes="any">
<title>Visuels Telegram | Le Terminal</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  :root{
    --void:#04060B;--base:#070A11;--surface:#0B1018;--elevated:#101724;
    --accent:#3B7DFF;--accent-deep:#1E5BE0;--accent-bright:#8FBAFF;
    --title:#F2F4F7;--body:#C3CAD4;--muted:#7E8794;
    --border:#3A414C;--hair:#1C212A;
    --bull:#4ADE9C;--bear:#F0647A;--neutral:#E8C268;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--base);color:var(--body);font:400 15px/1.5 'Inter',system-ui,sans-serif}
  .wrap{max-width:1200px;margin:0 auto;padding:40px 16px 64px}
  .eyebrow{font:600 11px/1 'JetBrains Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-bright)}
  h1{font:400 clamp(40px,6vw,64px)/.95 'Anton',sans-serif;text-transform:uppercase;margin:12px 0 8px;
     background:linear-gradient(178deg,#FFFFFF 8%,#EDF1F6 48%,#C4CDD8 82%,#9AA5B2 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:var(--muted);margin:0 0 32px;max-width:640px}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:20px}
  .field{margin-bottom:14px}
  label{display:block;font:600 10px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input,select{width:100%;background:var(--elevated);border:1px solid var(--hair);border-radius:4px;color:var(--title);
     font:500 14px/1 'JetBrains Mono',monospace;padding:10px 12px;outline:none;transition:border-color .3s var(--ease)}
  input:focus,select:focus{border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
  .seg button{background:var(--elevated);border:1px solid var(--hair);border-radius:4px;color:var(--body);
     font:700 12px/1 'JetBrains Mono',monospace;letter-spacing:.08em;padding:10px 0;cursor:pointer;transition:all .3s var(--ease)}
  .seg button.on{border-color:var(--accent);color:var(--title);box-shadow:0 0 0 1px var(--accent) inset}
  .check{display:flex;gap:8px;align-items:center;font:400 13px/1.4 'Inter',sans-serif;letter-spacing:0;text-transform:none;color:var(--body);margin:4px 0 16px;cursor:pointer}
  .check input{width:auto}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:6px;cursor:pointer;
     background:var(--accent);color:#fff;font:700 13px/1 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:14px;
     transition:background .3s var(--ease)}
  .btn:hover{background:var(--accent-deep)}
  .btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .preview canvas{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--hair)}
  .hint{font-size:12px;color:var(--muted);margin-top:10px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">Outil interne · Telegram</span>
  <h1>Visuels de trade</h1>
  <p class="lede">Choisissez l'état du trade, renseignez les chiffres, puis téléchargez l'image (1280 × 720, PNG) à joindre à votre post Telegram.</p>

  <div class="grid">
    <form class="panel" id="form" onsubmit="return false">
      <label>État du trade</label>
      <div class="seg" id="seg">
        <button type="button" data-s="tp1" class="on">TP1</button>
        <button type="button" data-s="tp2">TP2</button>
        <button type="button" data-s="tp3">TP3</button>
        <button type="button" data-s="sl">SL</button>
      </div>

      <label class="check"><input type="checkbox" id="generic"> Version générique (sans chiffres)</label>

      <div id="data">
        <div class="row">
          <div class="field"><label for="asset">Actif</label><input id="asset" value="XAUUSD" maxlength="12"></div>
          <div class="field"><label for="side">Sens</label>
            <select id="side"><option value="buy">Achat</option><option value="sell">Vente</option></select></div>
        </div>
        <div class="row">
          <div class="field"><label for="entry">Entrée</label><input id="entry" value="2 345,50" inputmode="decimal"></div>
          <div class="field"><label for="exit">Prix de sortie</label><input id="exit" value="2 352,00" inputmode="decimal"></div>
        </div>
        <div class="row">
          <div class="field"><label for="pips">Pips</label><input id="pips" value="+65" maxlength="10"></div>
          <div class="field"><label for="rr">Résultat (R)</label><input id="rr" value="+1,3 R" maxlength="10"></div>
        </div>
        <div class="field"><label for="date">Date</label><input id="date" value=""></div>
      </div>

      <button type="button" class="btn" id="dl">
        <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
        Télécharger le PNG
      </button>
      <p class="hint">Les chiffres s'écrivent au format français : <code>2 345,50</code>.</p>
    </form>

    <div class="preview"><canvas id="cv" width="1280" height="720"></canvas></div>
  </div>
</div>

<script>
(function(){
  var W = 1280, H = 720;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var C = {
    void:'#04060B', base:'#070A11', surface:'#0B1018', elevated:'#101724',
    accent:'#3B7DFF', deep:'#1E5BE0', bright:'#8FBAFF',
    title:'#F2F4F7', body:'#C3CAD4', muted:'#7E8794', border:'#3A414C', hair:'#1C212A',
    bull:'#4ADE9C', bear:'#F0647A', neutral:'#E8C268'
  };
  // Contenu de chaque état — vouvoiement, ton feutré.
  var STATES = {
    tp1:{ big:'TP1', word:'ATTEINT', eyebrow:'OBJECTIF 1 / 3', color:C.bull, glow:'rgba(74,222,156,',
          line1:'Premier objectif encaissé.', line2:'Stop déplacé au point d’entrée : le risque est retiré.', step:1 },
    tp2:{ big:'TP2', word:'ATTEINT', eyebrow:'OBJECTIF 2 / 3', color:C.bull, glow:'rgba(74,222,156,',
          line1:'Deuxième objectif encaissé.', line2:'Le plan se déroule, la position restante court.', step:2 },
    tp3:{ big:'TP3', word:'ATTEINT', eyebrow:'OBJECTIF FINAL', color:C.bull, glow:'rgba(74,222,156,',
          line1:'Objectif final atteint.', line2:'Trade clôturé en totalité. Plan exécuté.', step:3 },
    sl: { big:'SL', word:'TOUCHÉ', eyebrow:'STOP LOSS', color:C.bear, glow:'rgba(240,100,122,',
          line1:'Perte limitée, conforme au plan.', line2:'Le risque était défini avant l’entrée. Trade suivant.', step:-1 }
  };

  // Valeurs d'exemple par état (remplacées dès que vous modifiez un champ)
  var EXAMPLES = {
    tp1:{ exit:'2 352,00', pips:'+65', rr:'+1,3 R' },
    tp2:{ exit:'2 358,50', pips:'+130', rr:'+2,6 R' },
    tp3:{ exit:'2 368,00', pips:'+225', rr:'+4,5 R' },
    sl: { exit:'2 340,50', pips:'\u221250', rr:'\u22121 R' }
  };
  var touched = false;

  var state = 'tp1';
  var logo = new Image();
  logo.src = '../logo.png';

  function $(id){ return document.getElementById(id); }
  function val(id){ return ($(id).value || '').trim(); }

  function today(){
    var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
  }

  // Texte avec interlettrage (canvas.letterSpacing n'est pas partout)
  function spaced(txt, x, y, sp, align){
    var w = 0, i;
    for (i = 0; i < txt.length; i++) w += ctx.measureText(txt[i]).width + (i < txt.length-1 ? sp : 0);
    if (align === 'right') x -= w; else if (align === 'center') x -= w/2;
    var a = ctx.textAlign; ctx.textAlign = 'left';
    for (i = 0; i < txt.length; i++){ ctx.fillText(txt[i], x, y); x += ctx.measureText(txt[i]).width + sp; }
    ctx.textAlign = a;
    return w;
  }

  function rrect(x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
  }

  function metal(y0, y1){
    var g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0.08,'#FFFFFF'); g.addColorStop(0.48,'#EDF1F6'); g.addColorStop(0.82,'#C4CDD8'); g.addColorStop(1,'#9AA5B2');
    return g;
  }

  function background(s){
    ctx.fillStyle = C.void; ctx.fillRect(0,0,W,H);
    // grille blueprint discrète
    ctx.strokeStyle = 'rgba(143,186,255,0.035)'; ctx.lineWidth = 1;
    for (var x = 0; x <= W; x += 40){ ctx.beginPath(); ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,H); ctx.stroke(); }
    for (var y = 0; y <= H; y += 40){ ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); ctx.stroke(); }
    // lueur froide (accent) + lueur d'état derrière la marque
    var g1 = ctx.createRadialGradient(240,620,0,240,620,520);
    g1.addColorStop(0,'rgba(59,125,255,0.10)'); g1.addColorStop(1,'rgba(59,125,255,0)');
    ctx.fillStyle = g1; ctx.fillRect(0,0,W,H);
    var g2 = ctx.createRadialGradient(990,330,0,990,330,380);
    g2.addColorStop(0, s.glow+'0.16)'); g2.addColorStop(1, s.glow+'0)');
    ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
    // vignette
    var v = ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,W*0.75);
    v.addColorStop(0,'rgba(4,6,11,0)'); v.addColorStop(1,'rgba(4,6,11,0.85)');
    ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
  }

  function header(){
    if (logo.complete && logo.naturalWidth){ ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.drawImage(logo, 56, 44, 52, 52); ctx.restore(); }
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.title; ctx.font = '700 22px Inter';
    var w = spaced('LE TERMINAL', 124, 71, 4.4);
    ctx.fillStyle = C.border; ctx.fillRect(124+w+18, 58, 1, 26);
    ctx.fillStyle = C.accent; ctx.font = '700 16px "JetBrains Mono"';
    spaced('SIGNAUX', 124+w+37, 72, 3.2);
  }

  // Logo aux bords fondus (le fond du fichier n'est pas un noir pur)
  var faded = null;
  function fadedLogo(){
    if (faded) return faded;
    var o = document.createElement('canvas'); o.width = o.height = 560;
    var x = o.getContext('2d');
    x.drawImage(logo, 0, 0, 560, 560);
    x.globalCompositeOperation = 'destination-out';
    [[0,0,24,0],[560,0,536,0],[0,0,0,24],[0,560,0,536]].forEach(function(e){
      var m = x.createLinearGradient(e[0],e[1],e[2],e[3]);
      m.addColorStop(0,'rgba(0,0,0,1)'); m.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle = m; x.fillRect(0,0,560,560);
    });
    return (faded = o);
  }

  function brandMark(s){
    // grand logo à droite : halo de l'état + fusion « screen » (le fond noir du logo disparaît)
    var g = ctx.createRadialGradient(990,290,0,990,290,210);
    g.addColorStop(0, s.glow+'0.22)'); g.addColorStop(0.6, s.glow+'0.06)'); g.addColorStop(1, s.glow+'0)');
    ctx.fillStyle = g; ctx.fillRect(760,60,460,460);
    if (!(logo.complete && logo.naturalWidth)) return;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(fadedLogo(), 850, 150, 280, 280);
    ctx.restore();
  }

  function title(s){
    ctx.textBaseline = 'alphabetic';
    // eyebrow
    ctx.fillStyle = s.color; ctx.font = '700 15px "JetBrains Mono"';
    ctx.beginPath(); ctx.arc(62, 170, 4, 0, Math.PI*2); ctx.fill();
    spaced(s.eyebrow, 78, 175, 3.6);
    // TP1 (couleur d'état) + ATTEINT (métal)
    ctx.font = '400 168px Anton';
    var g = ctx.createLinearGradient(0, 200, 0, 345);
    g.addColorStop(0, s.color); g.addColorStop(0.5, s.color); g.addColorStop(1, s.glow+'0.62)');
    ctx.fillStyle = g;
    ctx.fillText(s.big, 52, 345);
    var bw = ctx.measureText(s.big).width;
    ctx.font = '400 92px Anton';
    ctx.fillStyle = metal(262, 345);
    ctx.fillText(s.word, 52 + bw + 26, 345);
    // barre bleue courte + sous-titre
    ctx.fillStyle = C.accent; ctx.fillRect(58, 378, 64, 4);
    ctx.font = '500 24px Inter'; ctx.fillStyle = C.title;
    ctx.fillText(s.line1, 56, 425);
    ctx.font = '400 20px Inter'; ctx.fillStyle = C.body;
    ctx.fillText(s.line2, 56, 458);
  }

  // Frise Entrée → TP1 → TP2 → TP3 (ou Entrée → SL)
  function ladder(s, x0, y, x1){
    var nodes = s.step < 0 ? ['ENTRÉE','SL'] : ['ENTRÉE','TP1','TP2','TP3'];
    var reached = s.step < 0 ? 1 : s.step;
    var n = nodes.length, gap = (x1 - x0) / (n - 1);
    ctx.lineWidth = 2;
    ctx.strokeStyle = C.hair; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
    ctx.strokeStyle = s.color; ctx.shadowColor = s.color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x0 + gap*reached, y); ctx.stroke();
    ctx.shadowBlur = 0;
    for (var i = 0; i < n; i++){
      var x = x0 + gap*i, on = i <= reached;
      ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI*2);
      ctx.fillStyle = C.void; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = on ? (i === 0 ? C.accent : s.color) : C.border; ctx.stroke();
      if (on){ ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fillStyle = i === 0 ? C.accent : s.color; ctx.fill(); }
      ctx.font = '700 13px "JetBrains Mono"'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = on ? (i === 0 ? C.bright : s.color) : C.muted;
      spaced(nodes[i], x, y + 34, 2, 'center');
    }
  }

  function dataPanel(s, d){
    var x = 56, y = 520, w = 1168, h = 104;
    rrect(x, y, w, h, 10); ctx.fillStyle = 'rgba(16,23,36,0.86)'; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = C.hair; ctx.stroke();
    var cells = [
      ['ACTIF', d.asset.toUpperCase(), C.title],
      ['SENS', d.side === 'sell' ? '▼ VENTE' : '▲ ACHAT', d.side === 'sell' ? C.bear : C.bull],
      ['ENTRÉE', d.entry, C.title],
      [s.step < 0 ? 'SORTIE SL' : 'SORTIE TP'+s.step, d.exit, C.title],
      ['PIPS', d.pips, s.color],
      ['RÉSULTAT', d.rr, s.color]
    ];
    var cw = w / cells.length;
    for (var i = 0; i < cells.length; i++){
      var cx = x + cw*i + 28;
      if (i){ ctx.fillStyle = C.hair; ctx.fillRect(x + cw*i, y + 22, 1, h - 44); }
      ctx.textBaseline = 'alphabetic';
      ctx.font = '600 11px "JetBrains Mono"'; ctx.fillStyle = C.muted; spaced(cells[i][0], cx, y + 40, 2.2);
      ctx.font = '700 26px "JetBrains Mono"'; ctx.fillStyle = cells[i][2];
      fit(cells[i][1] || '—', cx, y + 78, cw - 44);
    }
  }

  function fit(txt, x, y, max){
    var size = 26;
    while (ctx.measureText(txt).width > max && size > 14){ size -= 1; ctx.font = '700 '+size+'px "JetBrains Mono"'; }
    ctx.fillText(txt, x, y);
  }

  function footer(d, generic){
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.hair; ctx.fillRect(56, 664, 1168, 1);
    ctx.font = '600 13px "JetBrains Mono"'; ctx.fillStyle = C.bright;
    spaced('LETERMINAL.NET', 56, 694, 2.4);
    ctx.font = '400 13px Inter'; ctx.fillStyle = C.muted; ctx.textAlign = 'right';
    var right = 'Le trading comporte un risque de perte en capital. Ceci n’est pas un conseil en investissement.';
    ctx.fillText(right, 1224, 694);
    ctx.textAlign = 'left';
    if (!generic && d.date){
      ctx.font = '500 14px "JetBrains Mono"'; ctx.fillStyle = C.muted;
      spaced(d.date, 1224, 72, 1.5, 'right');
    }
  }

  function draw(){
    var s = STATES[state];
    var generic = $('generic').checked;
    var d = { asset:val('asset'), side:$('side').value, entry:val('entry'), exit:val('exit'),
              pips:val('pips'), rr:val('rr'), date:val('date') };
    ctx.clearRect(0,0,W,H);
    background(s);
    brandMark(s);
    header();
    title(s);
    if (generic){
      ladder(s, s.step < 0 ? 300 : 120, 560, s.step < 0 ? 980 : 1160);
    } else {
      ladder(s, 860, 476, s.step < 0 ? 1120 : 1180);
      dataPanel(s, d);
    }
    footer(d, generic);
  }

  // Interface
  $('date').value = today();
  var q = new URLSearchParams(location.search);
  if (q.get('etat') && STATES[q.get('etat')]) state = q.get('etat');
  if (q.get('generique') === '1') $('generic').checked = true;

  function examples(){
    if (touched) return;
    var e = EXAMPLES[state];
    $('exit').value = e.exit; $('pips').value = e.pips; $('rr').value = e.rr;
  }

  function sync(){
    examples();
    [].forEach.call(document.querySelectorAll('#seg button'), function(b){ b.classList.toggle('on', b.getAttribute('data-s') === state); });
    $('data').classList.toggle('hidden', $('generic').checked);
    draw();
  }
  $('seg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    state = b.getAttribute('data-s'); sync();
  });
  $('form').addEventListener('input', function(e){ if (e.target.closest('#data')) touched = true; sync(); });
  $('form').addEventListener('change', sync);
  $('dl').addEventListener('click', function(){
    var generic = $('generic').checked;
    var name = 'le-terminal-' + state + (generic ? '' : '-' + (val('asset') || 'trade').toLowerCase().replace(/[^a-z0-9]+/g,'')) + '.png';
    var a = document.createElement('a'); a.download = name; a.href = cv.toDataURL('image/png'); a.click();
  });

  // Attendre logo + polices avant le premier rendu
  var fonts = ['400 168px Anton','700 22px Inter','500 24px Inter','400 20px Inter','400 13px Inter',
               '700 26px "JetBrains Mono"','700 15px "JetBrains Mono"','500 14px "JetBrains Mono"','600 13px "JetBrains Mono"','700 16px "JetBrains Mono"','700 13px "JetBrains Mono"','600 11px "JetBrains Mono"'];
  Promise.all(fonts.map(function(f){ return document.fonts.load(f, 'ÉTAPE 0123456789'); }).concat([
    new Promise(function(r){ if (logo.complete) r(); else { logo.onload = r; logo.onerror = r; } })
  ])).then(function(){ sync(); document.body.setAttribute('data-ready','1'); });
  sync();
})();
</script>
<script src="../lang.js"></script>
</body>
</html>
